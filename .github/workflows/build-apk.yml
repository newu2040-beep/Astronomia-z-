name: Build & Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_VER=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | awk -F '.' '{print $1}')
          if [ -z "$JAVA_VER" ]; then
            echo "Error: Unable to detect Java version."
            exit 1
          fi
          echo "Detected Java major version: $JAVA_VER"
          if [ "$JAVA_VER" -lt 17 ]; then
            echo "Error: Java major version must be 17 or newer. Found version $JAVA_VER."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkey -v -keystore ./debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ -f "./debug.keystore" ]; then
            echo "Confirmed: ./debug.keystore exists."
          else
            echo "Error: Failed to create ./debug.keystore"
            exit 1
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: $APK_PATH does not exist!"
            echo "Searching inside app/build/outputs/apk:"
            find app/build/outputs/apk -maxdepth 3 -name "*.apk" || true
            exit 1
          fi

          if [ ! -s "$APK_PATH" ]; then
            echo "Error: $APK_PATH is empty!"
            exit 1
          fi

          case "$APK_PATH" in
            *.apk) ;;
            *) echo "Error: $APK_PATH does not have .apk extension!"; exit 1 ;;
          esac

          echo "Confirmed: $APK_PATH exists, is a regular non-empty file, and matches expected path."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_DIR="${{ runner.temp }}/release_assets"
          mkdir -p "$TEMP_DIR"

          REPO_FULL="${{ github.repository }}"
          REPO_NAME="${REPO_FULL#*/}"
          SAFE_REPO_NAME=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_-]/-/g')
          if [ -z "$SAFE_REPO_NAME" ]; then
            SAFE_REPO_NAME="app"
          fi

          ASSET_NAME="${SAFE_REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          ASSET_PATH="${TEMP_DIR}/${ASSET_NAME}"

          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET_PATH"

          if [ -s "$ASSET_PATH" ]; then
            echo "Prepared release asset at: $ASSET_PATH"
            echo "asset_path=$ASSET_PATH" >> $GITHUB_OUTPUT
            echo "asset_name=$ASSET_NAME" >> $GITHUB_OUTPUT
          else
            echo "Error: Failed to prepare release asset at $ASSET_PATH"
            exit 1
          fi

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Asset file $ASSET_PATH does not exist or is empty!"
            exit 1
          fi

          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"
          NOTES=$(cat <<EOF
          This is an automatically generated debug APK.
          The APK was built by GitHub Actions.
          Run Number: ${{ github.run_number }}
          Run Attempt: ${{ github.run_attempt }}
          Commit SHA: ${{ github.sha }}

          • The APK is intended for testing.
          • The APK is not a Play Store production release.
          • The APK is signed only with a temporary debug keystore.
          EOF
          )

          gh release create "$TAG" "$ASSET_PATH" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "=== RELEASE PUBLISHING SUCCESSFUL ==="
            gh release view "$TAG" || true
            RELEASE_URL="${{ github.server_url }}/${{ github.repository }}/releases/tag/${TAG}"
            echo "Release Tag: $TAG"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"

            echo "### 🚀 Debug APK Release Published Successfully" >> $GITHUB_STEP_SUMMARY
            echo "The debug APK is available for direct download under the GitHub Release page:" >> $GITHUB_STEP_SUMMARY
            echo "- **Release Page**: [$RELEASE_URL]($RELEASE_URL)" >> $GITHUB_STEP_SUMMARY
            echo "- **Asset Filename**: \`$ASSET_NAME\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The APK can be downloaded directly onto a mobile phone from the release **Assets** section." >> $GITHUB_STEP_SUMMARY
            echo "The standard Actions artifact (\`app-debug-apk\`) is also available as a backup." >> $GITHUB_STEP_SUMMARY
          else
            echo "=== WARNING: RELEASE PUBLISHING FAILED OR WAS SKIPPED ==="
            echo "The APK build and artifact upload succeeded, but release publishing failed."
            echo "The debug APK artifact named 'app-debug-apk' remains available under GitHub Actions run artifacts."

            echo "### ⚠️ Debug APK Build Succeeded (Release Publishing Failed)" >> $GITHUB_STEP_SUMMARY
            echo "The APK build and artifact upload were completed successfully." >> $GITHUB_STEP_SUMMARY
            echo "However, publishing to GitHub Releases encountered an error." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Backup Artifact Available:** You can download the debug APK from the **Artifacts** section of this GitHub Actions run (Artifact name: \`app-debug-apk\`)." >> $GITHUB_STEP_SUMMARY
          fi
